            </nav>
        </div>
    </aside>

    <!-- Dock -->
    <nav class="dock" aria-label="Dock">
        <button class="dock-item t-profile" type="button" data-toggle="profileWin" data-label="Profile" aria-label="Profile"><svg aria-hidden="true"><use href="#i-user"/></svg></button>
        <button class="dock-item t-chat" type="button" data-toggle="chatWin" data-label="AI Chat" aria-label="AI Chat"><svg aria-hidden="true"><use href="#i-chat"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <a class="dock-item t-gh" href="https://github.com/Sunculp09" target="_blank" rel="noopener" data-label="GitHub" aria-label="GitHub"><svg aria-hidden="true"><use href="#i-gh"/></svg></a>
        <a class="dock-item t-in" href="https://www.linkedin.com/in/sunculp-shukla-2640232a1/" target="_blank" rel="noopener" data-label="LinkedIn" aria-label="LinkedIn"><svg aria-hidden="true"><use href="#i-in"/></svg></a>
        <a class="dock-item t-cv" href="https://drive.google.com/file/d/1ujztRR81G0A31-bBUdGjzc3AYr89pqxK/view?usp=drive_link" target="_blank" rel="noopener" data-label="Resume" aria-label="Resume"><svg aria-hidden="true"><use href="#i-cv"/></svg></a>
    </nav>

    <script>
        const API_URL = "https://ai-portfolio-backend-qo3h.onrender.com";

        const chat = document.getElementById("chat");
        const input = document.getElementById("question");
        const button = document.getElementById("askBtn");

        /* ---------- Clock ---------- */
        function tick() {
            document.getElementById("clock").textContent = new Date().toLocaleString([], {
                weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
            });
        }
        tick();
        setInterval(tick, 20000);

        /* ---------- Windows ---------- */
        let zTop = 10;

        function syncDock() {
            document.querySelectorAll("[data-toggle]").forEach(function (d) {
                const w = document.getElementById(d.dataset.toggle);
                d.classList.toggle("on", !w.classList.contains("hidden"));
            });
        }

        function setWin(id, show) {
            const w = document.getElementById(id);
            w.classList.toggle("hidden", !show);
            if (show) w.style.zIndex = ++zTop;
            syncDock();
        }

        document.querySelectorAll("[data-toggle]").forEach(function (el) {
            el.addEventListener("click", function () {
                const w = document.getElementById(el.dataset.toggle);
                setWin(el.dataset.toggle, w.classList.contains("hidden"));
            });
        });

        document.querySelectorAll(".win").forEach(function (w) {
            w.addEventListener("pointerdown", function () { w.style.zIndex = ++zTop; });

            w.querySelectorAll("[data-close]").forEach(function (b) {
                b.addEventListener("click", function () { setWin(w.id, false); });
            });

            w.querySelector("[data-max]").addEventListener("click", function () {
                w.classList.toggle("max");
            });

            const bar = w.querySelector(".titlebar");

            bar.addEventListener("pointerdown", function (e) {
                if (e.target.closest("button") || innerWidth < 700 || w.classList.contains("max")) return;

                const r = w.getBoundingClientRect();
                const ox = e.clientX - r.left, oy = e.clientY - r.top;

                w.style.width = r.width + "px";
                w.style.height = r.height + "px";
                w.style.right = "auto";
                w.style.bottom = "auto";
                bar.setPointerCapture(e.pointerId);

                function move(ev) {
                    w.style.left = Math.max(-r.width + 90, Math.min(innerWidth - 90, ev.clientX - ox)) + "px";
                    w.style.top = Math.max(30, Math.min(innerHeight - 60, ev.clientY - oy)) + "px";
                }
                function up() {
                    bar.removeEventListener("pointermove", move);
                    bar.removeEventListener("pointerup", up);
                }
                bar.addEventListener("pointermove", move);
                bar.addEventListener("pointerup", up);
            });
        });

        if (innerWidth >= 1100) setWin("profileWin", true);
        syncDock();

        /* ---------- Chat ---------- */
        document.querySelectorAll(".suggestions button").forEach(function (b) {
            b.addEventListener("click", function () {
                input.value = b.dataset.q;
                askAI();
            });
        });

        input.addEventListener("keydown", function (e) {
            if (e.key === "Enter") askAI();
        });

        button.addEventListener("click", askAI);

        function addMessage(kind, text) {
            const empty = document.getElementById("empty");
            if (empty) empty.remove();

            const el = document.createElement("div");
            el.className = "msg " + kind;
            el.textContent = text;
            chat.appendChild(el);
            chat.scrollTop = chat.scrollHeight;
            return el;
        }

        async function askAI() {

            const question = input.value.trim();

            if (!question || button.disabled) {
                return;
            }

            button.disabled = true;
            input.disabled = true;

            addMessage("user", question);
            input.value = "";

            const out = addMessage("ai", "");
            out.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';

            try {

                const response = await fetch(API_URL + "/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: question
                    })
                });

                if (!response.ok) {
                    throw new Error("Server error");
                }

                out.textContent = "";

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                let buffer = "";

                while (true) {

                    const { value, done } = await reader.read();

                    if (done) {
                        break;
                    }

                    buffer += decoder.decode(value, { stream: true });

                    const events = buffer.split("\n\n");

                    buffer = events.pop();

                    for (const event of events) {

                        const line = event.trim();

                        if (!line.startsWith("data: ")) {
                            continue;
                        }

                        let data;
                        try {
                            data = JSON.parse(line.substring(6));
                        } catch (e) {
                            continue;
                        }

                        if (data.content) {
                            out.textContent += data.content;
                            chat.scrollTop = chat.scrollHeight;
                        }
                    }
                }

                if (!out.textContent) {
                    out.textContent = "No response received. Please try again.";
                }

            } catch (error) {

                console.error(error);

                out.textContent = "Unable to connect to the server. Please try again in a moment.";
                out.classList.add("error");

            } finally {

                button.disabled = false;
                input.disabled = false;
                input.focus();
                chat.scrollTop = chat.scrollHeight;
            }
        }
    </script>

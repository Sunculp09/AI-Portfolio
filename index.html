<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 700px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        button:hover {
            background: #1d4ed8;
        }

        #chat {
            margin-top: 20px;
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
        }

        #chat p {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .user {
            text-align: right;
            background: #e8f0fe;
            margin-left: 80px !important;
            padding: 12px 15px !important;
        }

        .ai {
            text-align: left;
            background: #f1f3f5;
            margin-right: 80px !important;
            padding: 12px 15px !important;
        }

        .ai small {
            color: #666;
            font-size: 12px;
        }

        .profile {
            text-align: center;
            margin-top: 40px;
        }

        .profile h1 {
            margin-bottom: 8px;
        }

        .profile p {
            color: #666;
            margin: 0;
        }

        .profile-links {
            margin-top: 15px;
        }

        .profile-links a {
            margin: 0 8px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .profile-links a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <div class="profile">
        <h1>Sunculp Shukla</h1>

        <p>Data Analytics | AI Engineering | Business Analysis</p>

        <div class="profile-links">
            <a href="https://github.com/Sunculp09" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/sunculp-shukla-2640232a1/?isSelfProfile=true" target="_blank">LinkedIn</a>
            <a href="https://drive.google.com/file/d/1ujztRR81G0A31-bBUdGjzc3AYr89pqxK/view?usp=drive_link" target="_blank">
                Resume
            </a>
        </div>
    </div>

    <div class="container">

        <h1>AI Portfolio</h1>

        <p class="subtitle">
            Chat with my AI representative
        </p>

        <div class="input-area">
            <input
                type="text"
                id="question"
                placeholder="Ask me about my profile..."
                onkeydown="if(event.key === 'Enter') askAI()"
            >

            <button onclick="askAI()">Ask</button>
        </div>

        <div id="chat"></div>

    </div>

    <script>
        async function askAI() {

        const API_URL = "https://ai-portfolio-backend-qo3h.onrender.com";

        const input = document.getElementById("question");
        const question = input.value.trim();

        if (!question) {
            return;
        }

        const button = document.querySelector("button");
        button.disabled = true;

        try {

            const response = await fetch(`${API_URL}/chat`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: question
                })
            });

            if (!response.ok) {
                throw new Error("Server error");
            }

            document.getElementById("chat").innerHTML += `
                <p class="user"><b>You:</b> ${question}</p>
                <p class="ai">
                    <small>AI Response</small><br>
                    <b>AI:</b> <span class="ai-response">Thinking...</span>
                </p>
            `;

            const chat = document.getElementById("chat");

            const aiResponses = document.querySelectorAll(".ai-response");
            const currentResponse = aiResponses[aiResponses.length - 1];

            currentResponse.textContent = "";

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            let buffer = "";

            while (true) {

                const { value, done } = await reader.read();

                if (done) {
                    break;
                }

                buffer += decoder.decode(value, { stream: true });

                const events = buffer.split("\n\n");

                buffer = events.pop();

                for (const event of events) {

                    const line = event.trim();

                    if (!line.startsWith("data: ")) {
                        continue;
                    }

                    const data = JSON.parse(line.substring(6));

                    if (data.content) {
                        currentResponse.textContent += data.content;
                        chat.scrollTop = chat.scrollHeight;
                    }
                }
            }

            input.value = "";
            input.focus();

            button.disabled = false;

        } catch (error) {

            console.error(error);

            document.getElementById("chat").innerHTML += `
                <p class="ai">
                    <b>AI:</b> Unable to connect to the server.
                </p>
            `;
            button.disabled = false;
        }
    }
    </script>
